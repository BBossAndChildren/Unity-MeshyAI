<!doctype html>
<html lang="ko" data-mode="test"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>직업 체험 스튜디오 · 테스트</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#213b44;background:#edf2f0;font-size:15px}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-columns:310px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 24px;background:#fff;border-bottom:1px solid #d7e2dd}header strong{font-size:20px}header small{color:#678079}header button{margin-left:auto}button,input,select{font:inherit}.scenario-picker{font-size:12px;color:#577464;display:flex;align-items:center;gap:10px}.scenario-picker select{max-width:70%;padding:8px;border:1px solid #c9d9d0;border-radius:8px;background:white}button{cursor:pointer;border:1px solid #c9d9d0;background:white;border-radius:9px;padding:9px 13px;color:#25473d}button:hover{background:#ecf5ef}button:focus-visible,input:focus-visible{outline:3px solid #8dbfa7;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.primary{background:#296d56;color:white;border-color:#296d56}.primary:hover{background:#205741}aside{background:#f8faf8;min-height:0;display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-right:1px solid #d7e2dd}aside h1{font-size:16px;margin:0}input{padding:12px;border:1px solid #c9d9d0;border-radius:10px;width:100%;background:white}#catalog-count,#search-count{font-size:12px;color:#627b71}#scenario-list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:7px}.scenario{text-align:left;display:flex;flex-direction:column;gap:5px}.scenario span{font-size:12px;color:#6b8176}.scenario.selected{border-color:#3d8567;background:#e3f0e8;box-shadow:inset 3px 0 #3d8567}main{display:flex;flex-direction:column;min-height:0;min-width:0;padding:15px;gap:12px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar strong{margin-right:auto}#connection-status{font-size:13px;color:#416554}#selection-detail{white-space:pre-wrap;font-size:12px;color:#5b7467;margin:0;max-height:85px;overflow:auto}.stage{position:relative;flex:1;min-height:300px;border-radius:14px;overflow:hidden;background:#122329;box-shadow:0 8px 30px #1f453013}#unity-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14282d;color:#eef6ee}progress{width:min(360px,70%);accent-color:#80c5a0}#load-error{color:#ffbcaa;white-space:pre-wrap;max-width:80%}details{border:1px solid #d6e2d9;border-radius:10px;background:#fafcfa;padding:10px 13px}summary{cursor:pointer;font-size:13px;font-weight:600}.drawer{max-height:32vh;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{font-size:12px;padding:6px 10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#event-log{font:12px ui-monospace,monospace;padding-left:22px;max-height:130px;overflow:auto}#result-summary{font-size:13px;color:#335f48}#ack-status{font-size:12px;color:#64796e}.focused{grid-template-columns:0 minmax(0,1fr)}.focused aside{display:none}.focused #selection-detail{display:none}@media(max-width:760px){body{grid-template-columns:220px minmax(0,1fr)}header{padding:0 13px}header small{display:none}aside{padding:13px 10px}main{padding:9px}.toolbar strong{width:100%}.stage{min-height:280px}}@media(max-width:540px){body{grid-template-columns:1fr;grid-template-rows:54px auto minmax(0,1fr);height:auto;min-height:100dvh}aside{max-height:220px;border-right:0;border-bottom:1px solid #d7e2dd}.stage{height:70vh;flex:auto}header{grid-column:1}main{min-height:80vh}.focused{grid-template-columns:1fr;grid-template-rows:54px minmax(0,1fr)}}
</style></head><body>
<header><strong>직업 체험 스튜디오</strong><small>직업을 고르고, 공간 안에서 직접 일해 보세요.</small><button id="focus-game">게임에 집중</button></header>
<aside><h1>공간 선택</h1><label><input id="search" type="search" placeholder="직업 · 공간 · 고정 ID 검색" aria-label="직업 공간 시나리오 검색"></label><div id="catalog-count">대상 목록 준비 중</div><div id="search-count"></div><nav id="scenario-list" aria-label="직업 체험 목록"></nav></aside>
<main><div class="toolbar"><strong id="selected-title">체험을 선택해 주세요</strong><span id="connection-status" role="status">Unity 로딩 중</span><button id="start" class="primary" disabled>체험 시작</button><button id="end" disabled>종료 · 결과 받기</button></div><label class="scenario-picker">이 공간의 직업·시나리오 <select id="scenario-choice" aria-label="선택한 공간의 직업 시나리오"></select></label><p id="selection-detail"></p>
<div class="stage"><canvas id="unity-canvas" tabindex="0" aria-label="직업 3D 체험"></canvas><div id="loading"><strong>나의 업무 공간을 준비하고 있습니다</strong><progress id="progress" max="1" value="0"></progress><div id="load-error"></div></div></div>
<details id="result-drawer"><summary>과정과 결과 <span id="event-count">0</span>개 이벤트</summary><div class="drawer"><p id="result-summary">체험 종료 원본을 수신하면 결과를 표시합니다.</p><p id="ack-status">저장 ACK 미수신 · 로컬 수신기 성공은 실서비스 저장 검증과 구별됩니다.</p><div class="actions"><button id="retry" disabled>마지막 요청 재전송</button><button id="replay">원본 재전달 요청</button><button id="flush">대기 이벤트 전송</button><button id="copy">JSON 복사</button><button id="download">JSON 내려받기</button></div><details><summary>실시간 원본 이벤트 로그</summary><ol id="event-log"></ol></details><details><summary>종료 원본 JSON</summary><pre id="result-json">아직 종료 응답이 없습니다.</pre></details></div></details></main>
<script>document.getElementById('focus-game').onclick=function(){document.body.classList.toggle('focused');this.textContent=document.body.classList.contains('focused')?'체험 목록 보기':'게임에 집중';window.dispatchEvent(new Event('resize'));};</script>
<script type="module" src="frontend/suite-host.js"></script>
<script>
const canvas=document.getElementById('unity-canvas');
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},showBanner:(message,type)=>{if(type==='error')document.getElementById('load-error').textContent=message;}};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{window.officeUnity=instance;document.getElementById('loading').style.display='none';}).catch(e=>document.getElementById('load-error').textContent=String(e));script.onerror=()=>document.getElementById('load-error').textContent='Unity 로더를 불러오지 못했습니다. HTTP 서버로 실행해 주세요.';document.body.appendChild(script);
</script></body></html>
