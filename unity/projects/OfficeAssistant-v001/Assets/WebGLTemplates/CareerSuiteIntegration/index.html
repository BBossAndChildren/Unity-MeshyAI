<!doctype html>
<html lang="ko" data-mode="integration"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>직업 체험</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14282d;color:#eef6ee;font:16px system-ui,sans-serif}#unity-canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14282d}progress{width:min(380px,75vw);accent-color:#80c5a0}#load-error{color:#ffbcaa;white-space:pre-wrap;max-width:80vw}#connection-status{position:absolute;bottom:10px;left:14px;pointer-events:none;color:#d5e5df;font-size:12px}</style></head><body><canvas id="unity-canvas" tabindex="0" aria-label="직업 3D 체험"></canvas><div id="loading"><strong>업무 공간을 준비하고 있습니다</strong><progress id="progress" max="1" value="0"></progress><div id="load-error"></div></div><div id="connection-status" role="status">외부 호스트 연결 대기</div>
<script type="module" src="frontend/suite-host.js"></script><script>
const canvas=document.getElementById('unity-canvas');
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},showBanner:(message,type)=>{if(type==='error')document.getElementById('load-error').textContent=message;}};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{window.officeUnity=instance;document.getElementById('loading').style.display='none';}).catch(e=>document.getElementById('load-error').textContent=String(e));script.onerror=()=>document.getElementById('load-error').textContent='Unity 로더를 불러오지 못했습니다. HTTP 서버로 실행해 주세요.';document.body.appendChild(script);
window.addEventListener('career-experience:event',event=>{if(event.detail.type==='experience.started'){document.getElementById('connection-status').style.display='none';canvas.focus();}if(event.detail.type==='experience.ended'){const node=document.getElementById('connection-status');node.style.display='block';node.textContent='체험이 종료되었습니다.';}});
</script></body></html>
