<main><small>개별 에셋 조립 · 공용 팔레트 v001</small><h1>PAN-001 · 일반 사무실 · 정렬 v003</h1><p>드래그로 회전 · 축소 / 후면 확인 · 독립 GLB 뷰어</p><nav><button id="front">정면</button><button id="side">측면</button><button id="rear">후면</button><button id="small">축소</button><button id="wire">와이어프레임</button></nav><div class="card"><h2>일반 사무실</h2><p class="metric" id="direct-status">로딩 중</p><div class="view" id="direct" style="height:620px"></div></div><p>Unity WebGL 및 모바일 실기기 성능은 미검증입니다.</p></main>
<script type="importmap">{"imports":{"three":"/meshy/models/blender/AST-001/v001/preview/vendor/three.module.js","/meshy/models/blender/AST-001/v001/preview/utils/BufferGeometryUtils.js":"/meshy/models/blender/AST-001/v001/preview/vendor/BufferGeometryUtils.js"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from '/meshy/models/blender/AST-001/v001/preview/vendor/GLTFLoader.js';
let yaw=.55,pitch=.55,distance=12,wire=false,last=null;const entries=[];
function draw(){for(const e of entries){const w=e.host.clientWidth,h=e.host.clientHeight;e.renderer.setSize(w,h,false);e.camera.aspect=w/h;e.camera.updateProjectionMatrix();const d=distance*Math.max(1,.85/e.camera.aspect);e.camera.position.set(d*Math.cos(pitch)*Math.sin(yaw),1+d*Math.sin(pitch),d*Math.cos(pitch)*Math.cos(yaw));e.camera.lookAt(0,1,0);e.renderer.render(e.scene,e.camera);}}
for(const [name,version] of [['direct','v003']]){const host=document.getElementById(name),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0xf9f6ef);host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x918578,1.8));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,5,4);scene.add(light);const entry={host,scene,camera,renderer};entries.push(entry);
host.onpointerdown=e=>{last=[e.clientX,e.clientY];host.setPointerCapture(e.pointerId)};host.onpointermove=e=>{if(!last)return;yaw-=(e.clientX-last[0])*.008;pitch=Math.max(-.5,Math.min(1.2,pitch+(e.clientY-last[1])*.006));last=[e.clientX,e.clientY];draw()};host.onpointerup=()=>last=null;
try{const result=await new GLTFLoader().loadAsync(`/meshy/models/blender/AST-020/${version}/exports/model.glb`);entry.model=result.scene;scene.add(result.scene);draw();document.getElementById(name+'-status').textContent=`GLB 로드 완료 · ${renderer.info.render.triangles}삼각형 · 재질 1개 / 텍스처 1장`;}catch(error){document.getElementById(name+'-status').textContent='로드 실패: '+error.message;console.error(error)}}
document.getElementById('front').onclick=()=>{yaw=.55;pitch=.55;distance=12;draw()};document.getElementById('side').onclick=()=>{yaw=Math.PI/2;draw()};document.getElementById('rear').onclick=()=>{yaw=Math.PI+.55;draw()};document.getElementById('small').onclick=()=>{distance=distance>15?12:21;draw()};document.getElementById('wire').onclick=()=>{wire=!wire;for(const e of entries)e.model?.traverse(o=>{if(o.isMesh)o.material.wireframe=wire});draw()};addEventListener('resize',draw);
</script></html>
